<!DOCTYPE html>
<html>
<head><base href="https://cdn.jsdelivr.net/gh/skidding-code/korona-games@08a6d09813360092c09c26df8245cb6ed6fa143d/flashcard/balatro/">
  <script type="application/arctic-deferred">
    const PREFIX = "Balatro_Balala_";
    const originalOpen = indexedDB.open;
    const originalDeleteDatabase = indexedDB.deleteDatabase;
    indexedDB.open = function(name, version) {
      const prefixedName = PREFIX + name;
      return version !== undefined ? originalOpen.call(this, prefixedName, version) : originalOpen.call(this, prefixedName);
    };
    indexedDB.deleteDatabase = function(name) {
      return originalDeleteDatabase.call(this, PREFIX + name);
    };
  </script>
  <script type="application/arctic-deferred" data-arctic-src="love.min.js"></script>
  <title>Love.js</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(45deg, #000000 0%, #2a0a00 25%, #000000 50%, #1a0500 75%, #000000 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      transition: opacity 0.6s ease;
    }

    #credits {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(220, 144, 80, 0.2);
      border-radius: 8px;
      padding: 6px 10px 6px 8px;
      backdrop-filter: blur(6px);
    }

    #credits img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0.9;
    }

    #credits span {
      font-family: 'Figtree', sans-serif;
      font-size: 12px;
      color: rgba(230, 180, 120, 0.85);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .loading-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 90%;
      max-width: 480px;
    }

    #messageforyou {
      color: #e8a060;
      font-family: 'Figtree', sans-serif;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.6;
      max-width: 360px;
      animation: messageFade 0.8s ease forwards;
      opacity: 0;
    }

    #gifslot {
      display: none;
      max-width: 320px;
      max-height: 240px;
      border-radius: 8px;
      animation: messageFade 0.8s ease forwards;
      opacity: 0;
    }

    @keyframes messageFade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: linear-gradient(90deg, #1a0500, #c0320a, #e8a060);
      background-size: 200% 100%;
      animation: barFill 2.8s cubic-bezier(0.4,0,0.2,1) forwards,
                 barShimmer 2s linear infinite;
    }

    @keyframes barFill {
      0%   { width: 10%; }
      50%  { width: 80%; }
      100% { width: 100%; }
    }

    @keyframes barShimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-bar-bottom {
      position: fixed;
      bottom: 0; left: 0;
      height: 4px;
      width: 0%;
      background: linear-gradient(90deg, #1a0500, #c0320a, #e8a060);
      animation: barFill 2.8s cubic-bezier(0.4,0,0.2,1) forwards;
      z-index: 10001;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div id="credits">
      <img src="/images/aol.webp" alt="averyonline">
      <span>port by averyonline.xyz</span>
    </div>
    <div class="loading-inner">
      <div id="messageforyou"></div>
      <img id="gifslot" src="/images/balatrillion.gif" alt="">
      <div class="bar-track">
        <div id="loading-bar"></div>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script type="application/arctic-deferred" data-arctic-src="module.js"></script>

  <script type="application/arctic-deferred">
    (function() {
      const messages = [
        "LETS GO GAMBLING!!!!!!!!!!",
        "bro cooper get off the game and do your work",
        "vinny kirk",
        "balala",
        { gif: true },
      ];

      const pick = messages[Math.floor(Math.random() * messages.length)];
      const textEl = document.getElementById('messageforyou');
      const gifEl  = document.getElementById('gifslot');

      if (pick && pick.gif) {
        gifEl.style.display = 'block';
      } else {
        textEl.textContent = pick;
      }

      const screen = document.getElementById('loading-screen');

      function hideLoading() {
        screen.classList.add('fade-out');
        setTimeout(() => { screen.style.display = 'none'; }, 600);
      }

      window.addEventListener('load', function() {
        setTimeout(hideLoading, 3000);
      });
    })();
  </script>

  <script type="application/arctic-deferred">
    (async () => {
      const d = await getSource();
      Module = {
        INITIAL_MEMORY: 2**28,
        canvas: canvas,
        printErr: console.error,
        arguments: ["game.love"]
      };
      Module.preRun = [function() {
        Module.addRunDependency("fp game.love");
        var ptr = Module.getMemory(d.length);
        Module['HEAPU8'].set(d, ptr);
        Module.FS_createDataFile('/', "game.love", d, true, true, true);
        Module.removeRunDependency("fp game.love");
      }];
      Love(Module);
    })();
  </script>
</body>
</html>
