    <style>

        * { margin: 0; padding: 0; }

            position: absolute;

            left: 50%;
            transform: translate(-50%, -55%);
            border-radius: 35px;
            color: white;
            padding: 30px;
            line-height: 1.8;
            overflow: clip;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .loader {
            width: 100%;
            height: 4.8px;
            display: inline-block;
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
            border-radius: 10px;
            z-index: 9999;
            left: 0;
            bottom: 0;
        }
        .loader::after {
            content: '';
            width: 192px;
            height: 4.8px;
            background: #FFF;
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            animation: animloader 2s linear infinite;
