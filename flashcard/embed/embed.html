<!DOCTYPE html>
<html>
<head><base href="https://cdn.jsdelivr.net/gh/skidding-code/korona-games@91060fa5e7453966f7e58cb84f76da9462305d52/flashcard/embed/">
    <meta charset="UTF-8">
    <script src="/tinyhomework/all.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        * { margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: 'Montserrat'; }
        #sj-frame {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            border: none;
            z-index: 99999;
        }
        #loadingbox {
            position: absolute;
            z-index: 9999;
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            border-radius: 35px;
            color: white;
            padding: 30px;
            line-height: 1.8;
            overflow: clip;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .loader {
            width: 100%;
            height: 4.8px;
            display: inline-block;
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
            border-radius: 10px;
            z-index: 9999;
            left: 0;
            bottom: 0;
        }
        .loader::after {
            content: '';
            width: 192px;
            height: 4.8px;
            background: #FFF;
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            animation: animloader 2s linear infinite;
            z-index: 9999;
        }
        #fadeout {
            transition: all ease-in-out .4s;
        }
        #teacher-setup-dialogs-container {
            filter: drop-shadow(0px 0px 10px #ffffff);
        }
        @keyframes animloader {
            0% { left: 0; transform: translateX(-100%); }
            100% { left: 100%; transform: translateX(0%); }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div id="fadeout">
        <div id="loadingbox">
            <h1 id="theh1">deploying...</h1>
            <p id="thep">this might take a bit</p>
        </div>
        <span class="loader"></span>
        <div id="teacher-setup-dialogs-container"></div>
    </div>
    <script src="/assets/particles/particles.js"></script>
    <script src="/assets/particles/embed-app.js"></script>
    <script type="module" src="embed.js" defer></script>
</body>
</html>
