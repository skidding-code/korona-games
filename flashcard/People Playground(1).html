<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/skidding-code/korona-games@main/flashcard/">
  <title>people playground.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  
  <script>
    window.fileMergerConfig = {
      files: [
        { name: 'pggbog.data', parts: 7 },
        { name: 'pggbog.wasm', parts: 3 }
      ],
      basePath: 'Build/',
      debug: true
    };  
  </script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
  
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/pggbog.data",
      frameworkUrl: "Build/pggbog.framework.js",
      codeUrl: "Build/pggbog.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Studio Minus",
      productName: "People Playground",
      productVersion: "1"
    };
    var script = document.createElement("script");
    script.src = "Build/pggbog.loader.js";
    script.onload = () => {
      createUnityInstance(canvas, config);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
